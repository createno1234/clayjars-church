<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>질그릇 교회 관리자</title>
  <style>
    body { margin: 0; background-color: #faf6f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #auth-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; box-sizing: border-box;
    }
    .auth-card {
      background: white; border: 1px solid #ebdcc5; border-radius: 20px;
      padding: 32px; max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .auth-card h2 { margin: 0 0 12px; color: #3d2517; font-size: 20px; }
    .auth-card p { margin: 0 0 20px; color: #8e7561; font-size: 13px; line-height: 1.5; }
    .auth-card input {
      width: 100%; box-sizing: border-box; padding: 12px 14px;
      border: 1px solid #d8cebf; border-radius: 12px; font-size: 14px;
      margin-bottom: 16px; outline: none;
    }
    .auth-card button {
      width: 100%; padding: 13px; background: #b46d43; color: white;
      border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .auth-card button:hover { background: #945431; }
  </style>
</head>
<body>
  <div id="auth-box">
    <div class="auth-card">
      <h2>질그릇 교회 관리자</h2>
      <p>GitHub 개인 액세스 토큰을 입력하면<br>외부 서버 없이 즉시 관리자 화면이 열립니다.</p>
      <input type="password" id="pat-input" placeholder="ghp_로 시작하는 토큰 입력" />
      <button onclick="loginWithToken()">관리자 대시보드 열기</button>
    </div>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  <script>
    // 저장된 토큰 확인
    const userStr = localStorage.getItem('netlify-cms-user') || localStorage.getItem('decap-cms-user');
    if (userStr) {
      try {
        const u = JSON.parse(userStr);
        if (u && u.token) {
          document.getElementById('auth-box').style.display = 'none';
        }
      } catch (e) {}
    }

    function loginWithToken() {
      const token = document.getElementById('pat-input').value.trim();
      if (!token) {
        alert('토큰을 입력해 주세요.');
        return;
      }
      // Decap CMS가 요구하는 필수 데이터 구조 완벽 동기화
      const authData = {
        backendName: 'github',
        token: token
      };
      localStorage.setItem('netlify-cms-user', JSON.stringify(authData));
      localStorage.setItem('decap-cms-user', JSON.stringify(authData));
      document.getElementById('auth-box').style.display = 'none';
      window.location.reload();
    }
  </script>
</body>
</html>
