<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>질그릇 교회 관리자</title>
  <style>
    #manual-login-box {
      position: fixed;
      inset: 0;
      background: #faf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #ebdcc5;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 380px;
      width: 90%;
      text-align: center;
    }
    .login-card h2 {
      margin: 0 0 10px;
      color: #3d2517;
      font-size: 20px;
    }
    .login-card p {
      margin: 0 0 20px;
      color: #8e7561;
      font-size: 13px;
      line-height: 1.5;
    }
    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d8cebf;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: #b46d43;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-card button:hover {
      background: #945431;
    }
  </style>
</head>
<body>
  <div id="manual-login-box">
    <div class="login-card">
      <h2>질그릇 교회 관리자 로그인</h2>
      <p>GitHub 개인 액세스 토큰(PAT)을 입력하시면 Netlify 없이 바로 관리자 화면이 열립니다.</p>
      <input type="password" id="gh-token-input" placeholder="ghp_로 시작하는 토큰 붙여넣기" />
      <button onclick="submitToken()">관리자 시작하기</button>
    </div>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>

  <script>
    // 이미 저장된 토큰이 있는지 확인
    const savedToken = localStorage.getItem("decap-cms-user") || localStorage.getItem("netlify-cms-user");
    if (savedToken) {
      try {
        const parsed = JSON.parse(savedToken);
        if (parsed.token) {
          document.getElementById("manual-login-box").style.display = "none";
        }
      } catch (e) {}
    }

    function submitToken() {
      const input = document.getElementById("gh-token-input");
      const val = input.value.trim();
      if (!val) {
        alert("토큰을 입력해 주세요.");
        return;
      }
      const data = { backendName: "github", token: val };
      localStorage.setItem("decap-cms-user", JSON.stringify(data));
      localStorage.setItem("netlify-cms-user", JSON.stringify(data));
      location.reload();
    }
  </script>
</body>
</html>
