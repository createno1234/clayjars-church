backend:
  name: git-gateway
  branch: main

media_folder: "gallery"
public_folder: "gallery"

collections:
  - name: "gallery"
    label: "교회 앨범 사진"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "사진 제목", name: "title", widget: "string" }
      - { label: "촬영 날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "사진 파일", name: "image", widget: "image" }
      - { label: "간단한 설명", name: "description", widget: "text", required: false }
