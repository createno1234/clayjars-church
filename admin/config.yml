backend:
  name: git-gateway
  branch: main

media_folder: "gallery"
public_folder: "gallery"

collections:
  - name: "gallery"
    label: "교회 앨범 사진"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "앨범 제목", name: "title", widget: "string" }
      - label: "카테고리 분류"
        name: "category"
        widget: "select"
        options: ["수련회/리트릿", "주일예배", "행사/친교", "빚음부(교회학교)"]
        default: "행사/친교"
      - { label: "촬영 일자", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "대표/단일 사진", name: "image", widget: "image" }
      - { label: "간단한 설명", name: "description", widget: "text", required: false }
